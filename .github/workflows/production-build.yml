name: SocietyOS Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: societyos-production-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, xml, curl, pdo_mysql
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find app config public database -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done

      - name: Linked-home regression contract
        run: php tests/regression/linked_home_role_scope.php

      - name: Multi-role user regression contract
        run: php tests/regression/multi_role_user_accounts.php

      - name: Prepare deployment branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/societyos-deploy
          mkdir -p /tmp/societyos-deploy
          rsync -a --exclude='.git/' ./ /tmp/societyos-deploy/

          git branch -D deploy 2>/dev/null || true
          git switch --orphan deploy
          git rm -rf . || true

          # Rehydrate the working tree without deleting the .git directory.
          rsync -a /tmp/societyos-deploy/ ./

          # vendor/ is excluded from main but is required on the deployment branch.
          git add -A
          git add -f vendor/

          if git diff --cached --quiet; then
            echo "No deployment changes to publish."
            exit 0
          fi

          git commit -m "Build production deployment from ${GITHUB_SHA::7}"
          git push --force origin deploy

      - name: Detect BigRock FTP document-root path
        id: detect-ftp-root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          listing="$(
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" -e \
              "set ftp:ssl-force true; set ssl:verify-certificate true; cls -1; bye" \
              2>/dev/null
          )"

          # BigRock's document root for this domain is /home1/dairyikh/society.dairy-dealer.net.
          # If the FTP account is rooted at /home1/dairyikh, deploy into that directory.
          # If the FTP account is already jailed to the domain directory, deploy at ./ instead.
          if printf '%s\n' "$listing" | grep -Fxq 'society.dairy-dealer.net'; then
            echo 'Detected FTP account root above the domain document root.'
            echo 'server_dir=society.dairy-dealer.net/' >> "$GITHUB_OUTPUT"
          else
            echo 'Detected FTP account already rooted at the domain document root.'
            echo 'server_dir=./' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production build to BigRock via FTPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ steps.detect-ftp-root.outputs.server_dir }}
          dangerous-clean-slate: false
          security: strict
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .env
            .env.*
            deployment-cron.log
            .ftp-deploy-sync-state.json
